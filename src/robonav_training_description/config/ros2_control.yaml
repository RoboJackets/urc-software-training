controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters: {}

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.34
    wheel_radius: 0.075

    base_frame_id: base_footprint
    odom_frame_id: odom
    # The EKF owns the odom -> base_footprint transform, so the controller
    # only publishes its odometry topic and does not broadcast TF.
    enable_odom_tf: false
    publish_rate: 50.0

    cmd_vel_timeout: 0.5
    use_stamped_vel: false

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.7
    linear.x.min_velocity: -0.7
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.5

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.5
    angular.z.min_velocity: -2.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 4.0
